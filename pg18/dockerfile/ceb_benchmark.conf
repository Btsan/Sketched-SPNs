# PostgreSQL settings for CEB cardinality estimation benchmarking.
# Included from postgresql.conf at cluster init.
#
# shared_buffers must not exceed --shm-size on docker run.
# With --shm-size=64g, 32GB leaves headroom for other shm consumers.
#
# effective_cache_size is a planner hint only (no memory allocated).
# Set it to approximately total system RAM if the host has more than 64 GB.

# --- Memory ------------------------------------------------------------
shared_buffers            = 32GB
effective_cache_size      = 56GB
work_mem                  = 2GB
maintenance_work_mem      = 2GB

# --- Parallelism -------------------------------------------------------
# Benchmark queries must run single-threaded for reproducible plan selection.
# Maintenance workers are kept available for parallel CREATE INDEX / COPY
# during dataset setup, which is not part of the benchmarking metrics.
max_parallel_workers_per_gather  = 0
max_parallel_workers             = 8
max_parallel_maintenance_workers = 4

# --- Benchmarking stability --------------------------------------------
jit                 = off   # JIT compilation perturbs plan choices across runs
synchronous_commit  = off   # durability not required; reduces write latency during load
geqo                = off   # genetic query optimization is non-deterministic
enable_memoize      = off 